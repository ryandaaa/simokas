name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Berjalan setelah kerangka Laravel ada (composer.json). Sebelum itu, job ini dilewati.
    if: ${{ hashFiles('composer.json') != '' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: simokas_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: simokas_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      BROADCAST_CONNECTION: log
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip, fileinfo
          coverage: pcov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Tests (Pest) with coverage threshold
        run: ./vendor/bin/pest --parallel --coverage --min=80
