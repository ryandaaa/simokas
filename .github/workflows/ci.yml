name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Sebelum kerangka Laravel ada (composer.json), job ini lulus tanpa menjalankan apa pun.
    # Pengecekan dilakukan di level step karena hashFiles() tidak tersedia di `if` level job.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: simokas_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: simokas_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      BROADCAST_CONNECTION: log
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: Detect Laravel project
        id: detect
        run: |
          if [ -f composer.json ]; then echo "laravel=true" >> "$GITHUB_OUTPUT"; else echo "laravel=false" >> "$GITHUB_OUTPUT"; echo "composer.json belum ada, langkah CI dilewati."; fi

      - uses: shivammathur/setup-php@v2
        if: steps.detect.outputs.laravel == 'true'
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip, fileinfo
          coverage: pcov

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.laravel == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        if: steps.detect.outputs.laravel == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        if: steps.detect.outputs.laravel == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        if: steps.detect.outputs.laravel == 'true'
        run: |
          npm ci
          npm run build

      - name: Code style (Pint)
        if: steps.detect.outputs.laravel == 'true'
        run: composer lint

      - name: Static analysis (Larastan)
        if: steps.detect.outputs.laravel == 'true'
        run: composer analyse

      - name: Tests (Pest) with coverage threshold
        if: steps.detect.outputs.laravel == 'true'
        run: ./vendor/bin/pest --parallel --coverage --min=80
